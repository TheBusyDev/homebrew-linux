name: Clean up autobump branches

on:
  workflow_dispatch:
  push:
    branches:
      - dev-cleanbump
  schedule:
    # Every Monday at 00:00 UTC.
    - cron: '0 0 * * 1'

jobs:
  cleanup:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write

    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install dependencies
        run: ./scripts/install_deps.sh

      - name: Delete bump branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO_NAME: ${{ github.repository }}
          BRANCH_PREFIX: 'bump-'
        run: ./scripts/clean_bump.sh
