name: Homebrew tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - dev-tests

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install dependencies
        run: ./scripts/install_deps.sh

      - name: Check style
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/style.sh

      - name: Automated tests on bash scripts
        if: matrix.os == 'ubuntu-24.04-arm'
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/automated_tests.sh

      - name: Install formulae and casks
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: ./scripts/install_formulae_and_casks.sh
