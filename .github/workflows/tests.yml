name: Homebrew tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev-tests
  pull_request:

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install dependencies
        run: ./scripts/install_deps.sh

      - name: Check style of the tap
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: ./scripts/style.sh

      - name: Check target OS
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: ./scripts/check_os.sh

      - name: Install formulae and casks
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: ./scripts/install_formulae_and_casks.sh
