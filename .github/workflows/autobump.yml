name: Homebrew autobump

on:
  workflow_dispatch:
  push:
    branches:
      - dev-autobump
  schedule:
    # Every Sunday at 00:00 UTC.
    - cron: '0 0 * * 0'

env:
  COMMITTER_USERNAME: ${{ github.repository_owner }}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1

      - name: Install dependencies
        run: ./scripts/install_deps.sh

      - name: Set up git
        id: git-setup
        uses: Homebrew/actions/git-user-config@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          username: ${{ env.COMMITTER_USERNAME }}

      - name: Bump formulae and casks
        id: brew-bump
        env:
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          GH_TOKEN: ${{ secrets.HOMEBREW_LINUX_TOKEN }}
          GH_COOLDOWN: 10
          COMMITTER_NAME: ${{ steps.git-setup.outputs.name }}
          COMMITTER_EMAIL: ${{ steps.git-setup.outputs.email }}
          BUMP_PR_LABEL: autobump
        run: ./scripts/bump.sh

      - name: Auto-approve PRs safely
        if: |
          always() &&
          steps.brew-bump.conclusion != 'skipped' &&
          steps.brew-bump.outputs.pr-numbers != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBERS: ${{ steps.brew-bump.outputs.pr-numbers }}
        run: ./scripts/approve.sh "${PR_NUMBERS}"